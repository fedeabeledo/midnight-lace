services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: midnightlace
      POSTGRES_PASSWORD: midnightlace
      POSTGRES_DB: midnightlace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U midnightlace"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://midnightlace:midnightlace@db:5432/midnightlace
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-en-produccion-32chars}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: noreply@midnightlace.com
      SMTP_FROM_NAME: Midnight Lace
      SMTP_USE_TLS: "true"
      API_KEY: ${API_KEY:-}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
